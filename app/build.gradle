plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace = 'atorch.shortestpaths'
    compileSdk = 36

    defaultConfig {
        applicationId = 'atorch.shortestpaths'
        // AndroidX (including AppCompat 1.8) now requires API 23 (Android 6.0) or higher
        minSdk = 23
        // Google Play requires API 36 for new apps and updates from August 31, 2026
        targetSdk = 36
        versionCode = 5
        versionName = '1.4'
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }

    testOptions {
        unitTests {
            // Robolectric tests read the app's resources (strings, puzzle CSVs)
            includeAndroidResources = true
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

dependencies {
    implementation libs.androidx.appcompat

    testImplementation libs.junit
    testImplementation libs.robolectric
}

// Print the full stack trace of failing tests in the build log (CI keeps nothing else)
tasks.withType(Test).configureEach {
    testLogging {
        events 'failed'
        exceptionFormat = 'full'
    }
}
