plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace = 'atorch.shortestpaths'
    compileSdk = 36

    defaultConfig {
        applicationId = 'atorch.shortestpaths'
        // AndroidX (including AppCompat 1.8) now requires API 23 (Android 6.0) or higher
        minSdk = 23
        // Google Play requires API 36 for new apps and updates from August 31, 2026
        targetSdk = 36
        versionCode = 5
        versionName = '1.4'
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

dependencies {
    implementation libs.androidx.appcompat
}
