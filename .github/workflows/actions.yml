name: Build
on:
  push:
    branches: [ main ]
  # Every pull request, including ones stacked on another PR's branch
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - run: ./gradlew build
